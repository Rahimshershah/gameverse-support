name: Suggest an idea
description: A new game, a feature, or a change you'd like to see
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and why would it make GameVerse better?
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Which game does it relate to? (if any)
